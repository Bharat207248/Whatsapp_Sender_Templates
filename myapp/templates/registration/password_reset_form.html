{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Sea News Network</title>
    <link rel="stylesheet" href="{% static 'myapp/css/auth.css' %}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-logo">W</div>
            <h1 class="auth-welcome">FORGOT PASSWORD</h1>
            <p class="auth-subtitle">Enter the email address used while creating your account.</p>

            {% if form.email.errors %}
                <div class="auth-error-box">{{ form.email.errors }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="id_email">Registered email</label>
                    <input type="email" name="email" id="id_email" autocomplete="email" required autofocus>
                </div>
                <button type="submit" class="auth-primary-button">Send Reset Link</button>
            </form>

            <div class="auth-links"><a href="{% url 'login' %}">Back to login</a></div>
        </section>
    </main>
</body>
</html>
